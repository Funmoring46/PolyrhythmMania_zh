practice.tutorial1.text0=把[color=#fefefe font=prmania_icons scale=4 offsety=-0.125]R[]红色物体移到对方吧！\n[color=GRAY](按{0}可进入下一步。)[]
practice.tutorial1.text1=使用节奏按\uE0A0 [color=GRAY]({0})[]可以把红色物体\n跳起来。
practice.tutorial1.text1a=你有看到[color=#fefefe font=prmania_icons scale=2 offsety=0.0]I[]吗？
practice.tutorial1.text1b=它显示你按下[color=prmania_tempo]卡点的精度[]。
practice.tutorial1.text1c=如果你按的太早，左边会闪亮。
practice.tutorial1.text1d=如果你按的太晚，右边边会闪亮。
practice.tutorial1.text1e=但是如果你完美踩准节拍，你会获得一个[color=prmania_ace]Ace（完美踩准）[]!
practice.tutorial1.text1f=尽量多获取[color=prmania_ace]Aces[]在这个游戏里！\nOkay, moving on...
practice.tutorial1.text2=有些时候你也得按下\n\uE0D0 [color=GRAY]({0})[]键哦。
practice.tutorial1.text3=做得好！
practice.tutorial1.text4=现在，双方都会有物体出来。
practice.tutorial1.text5=完美！
practice.tutorial1.text6=最后，我们会加快速度。
practice.tutorial1.text7=好像你已经掌握了疯狂复节奏的玩法了。
practice.tutorial1.text8=你准备上你第一个轮班吗？
practice.tutorial2.text0a=谢谢你在休息日来帮忙。
practice.tutorial2.text0b=今天的训练课程会教你怎么处理\n更复杂的订单。
practice.tutorial2.text1=我们从右手开始
practice.tutorial2.text2a=好。
practice.tutorial2.text2b=左手呢？
practice.tutorial2.text3a=Great! Now let's do it\nsimultaneously.
practice.tutorial2.text3b=I know you'll figure it out.\nDon't give up!
practice.tutorial2.text4a=You're a natural!
practice.tutorial2.text4b=Finally, let's try a\nslightly harder variation.
practice.tutorial2.text5a=Fantastic! And that concludes\ntraining for today.
practice.tutorial2.text5b=Thanks again for coming in.

