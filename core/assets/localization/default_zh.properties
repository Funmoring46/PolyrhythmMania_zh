#solitaire.instructions.1=Build a scale by stacking all the numbered cards from 1-7 in ascending order onto the right side of the table. The [font=prmania_icons offsety=-0.25 color=#FEFEFE]w[] card will automatically finish the scale.
#solitaire.instructions.2=You can move numeric cards in the centre of the table so long if they are in descending order and are of alternating suits.
#solitaire.instructions.3=The [font=prmania_icons scale=1.5 offsety=-0.125 color=#FEFEFE]W[] and [font=prmania_icons scale=2 offsety=-0.125 color=#FEFEFE]R[] cards can only be moved together if they are all the [i]same[] suit and are of alternating symbols.
#solitaire.instructions.4=Move an assembled widget ([font=prmania_icons scale=1.5 offsety=-0.125 color=#FEFEFE]W[]+[font=prmania_icons scale=2 offsety=-0.125 color=#FEFEFE]R[]+ [font=prmania_icons scale=1.5 offsety=-0.125 color=#FEFEFE]W[]) to a free cell in the top left to collapse it. You can also put any one card in a free cell.
